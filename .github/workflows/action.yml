name: Webpage - Resume
on:
  workflow_run:
    workflows: [pages-build-deployment]
    types:
      - completed

jobs:
  webpage-resume-pdf:
    name: Webpage - Resume - PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          ref: pdf
      - name: Webpage to PDF
        uses: misaelnieto/web_to_pdf_action@68f5ea023bee362a06844daa772045a48b73d8cd # master as of 2026-08-04
        with:
          webPageURL: https://resume.patrick.taylors.family
          outputFile: webpage/resume.pdf
          usePuppeteer: true
          useScreen: true
          pdfOptions: '{"format": "Letter", "margin": {"top": "10mm", "left": "10mm", "right": "10mm", "bottom": "10mm"}}'
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'change: Generate PDF'
          branch: pdf
          file_pattern: webpage/resume.pdf
